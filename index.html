<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>Find | Sample | ArcGIS Maps SDK for JavaScript 4.32</title>
    <link rel="stylesheet" href="public/css/styles.css">

    <link rel="stylesheet" href="https://js.arcgis.com/4.32/esri/themes/light/main.css" />
    <script type="module" src="https://js.arcgis.com/4.32/"></script>
    <script type="module" src="https://js.arcgis.com/calcite-components/3.0.3/calcite.esm.js"></script>
  </head>
  <body>
    <div class="esri-widget">
      Use find on a Map Service to view the population and other information by city name. <br />
      <br />
      Find by City Name:
      <input type="text" id="inputTxt" size="40" value="New" />
      <input type="button" value="Find" id="findBtn" />
      <div id="errorMsg" aria-live="polite"></div>
      <calcite-loader id="calciteLoader" label="loading" type="indeterminate" hidden></calcite-loader>
      <table id="tbl"></table>
    </div>
    <script src="public/js/find.js"></script>
  </body>
</html>
